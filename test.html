<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>[테스트] 증강 체스</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1efe8;--paper:#fbfaf6;--ink:#1f1e1c;--mut:#6b6860;--ac:#d99a2b;--acs:#f6e3b8;--sl:#f3ddb4;--sd:#c6a173;--sh:3px 3px 0 var(--ink);
 --r0:#9b988f;--r1:#3b7bd6;--r2:#8a4fd8;--r3:#e0a21c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121211;--paper:#1f1e1c;--ink:#efece4;--mut:#aaa59a;--acs:#4a3a1c}}
:root[data-theme="dark"]{--bg:#121211;--paper:#1f1e1c;--ink:#efece4;--mut:#aaa59a;--acs:#4a3a1c}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.5 "Noto Sans KR",system-ui,sans-serif;min-height:100vh;
 background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1.2px);background-size:22px 22px}
main{max-width:1240px;margin:0 auto;padding:18px 16px 48px}
h1,h2,h3{margin:0;font-weight:900;letter-spacing:-.02em}
p{margin:0}
button{font:inherit;font-weight:700;cursor:pointer;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:7px 14px;box-shadow:2px 2px 0 var(--ink);transition:transform .08s,box-shadow .08s}
button:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
button:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
button:disabled{cursor:not-allowed;opacity:.5;transform:none;box-shadow:2px 2px 0 var(--ink)}
button:focus-visible,.sq:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button.ac,.seg .on{background:var(--ac);color:#1f1e1c}
.box{background:var(--paper);border:2px solid var(--ink);border-radius:12px;box-shadow:var(--sh)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* menu */
.mh{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin:6px 0 18px}
.mh h1{font-size:clamp(1.6rem,4.4vw,2.4rem);line-height:1.15;word-break:keep-all}
.mh p{color:var(--mut);margin-top:6px}
.opts{padding:14px 16px;display:grid;gap:10px;margin-bottom:22px}
.opt{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.opt>b{min-width:5.5em;font-weight:900}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{padding:5px 11px;font-size:.88rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}
.tile{position:relative;display:flex;flex-direction:column;gap:10px;text-align:center;padding:14px 14px 12px;border-radius:14px;box-shadow:4px 4px 0 var(--ink);min-height:230px}
.tile:hover{box-shadow:5px 5px 0 var(--ink)}
.tile h3{font-size:1.1rem}
.tile .art{height:86px;border:2px solid var(--ink);border-radius:8px;display:flex;align-items:center;justify-content:center;gap:2px;
 background:conic-gradient(var(--sd) 25%,var(--sl) 0 50%,var(--sd) 0 75%,var(--sl) 0) 0 0/28px 28px}
.tile .art svg{width:46px;height:46px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.tile .dsc{font-size:.85rem;color:var(--mut);flex:1;display:flex;align-items:center;justify-content:center;word-break:keep-all}
.tile .kd{text-align:left;font-weight:900;font-size:.8rem;letter-spacing:.04em}
.tag-hot{position:absolute;top:-14px;right:14px;background:var(--ac);color:#1f1e1c;border:2px solid var(--ink);border-radius:8px;padding:1px 10px;font-weight:900;font-size:.8rem;box-shadow:2px 2px 0 var(--ink)}
/* game */
.hd{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:2px 0 14px}
.hd h1{font-size:clamp(1.15rem,2.6vw,1.6rem);word-break:keep-all}
.hd .sub{color:var(--mut);font-size:.88rem}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tb button{padding:5px 12px;font-size:.88rem}
.bdg{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:9px;padding:4px 11px;font-weight:900;font-size:.85rem;background:var(--paper);box-shadow:2px 2px 0 var(--ink)}
.bdg.ph{background:var(--acs)}
.bdg i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);display:inline-block}.bdg i.w{background:#fff}.bdg i.b{background:#1f1e1c}
.gm{display:grid;grid-template-columns:200px minmax(0,560px) minmax(260px,1fr);gap:18px;align-items:start}
.kibo{display:flex;flex-direction:column;max-height:640px;overflow:hidden}
.bh{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:2px solid var(--ink);font-weight:900}
.bh span{color:var(--mut);font-weight:700;font-size:.85rem}
.kl{list-style:none;margin:0;padding:8px 10px;overflow:auto;font-size:.9rem;display:grid;grid-template-columns:2.4em 1fr 1fr;gap:2px 6px;align-content:start;min-height:120px}
.kl .no{color:var(--mut)}.kl .cd2{grid-column:1/-1;color:var(--ac);font-weight:700;font-size:.82rem}
.kl .em{grid-column:1/-1;color:var(--mut);font-size:.85rem}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:10px}
.tagp{display:flex;align-items:center;gap:8px;padding:6px 10px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);box-shadow:2px 2px 0 var(--ink);min-width:0}
.tagp.on{background:var(--acs)}
.tagp b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tagp .cnt{margin-left:auto;color:var(--mut);font-size:.8rem;white-space:nowrap}
.av{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);flex:none}.av.w{background:#fff}.av.b{background:#1f1e1c}
.vsd{width:30px;height:30px;transform:rotate(45deg);background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;border-radius:5px}
.vsd span{transform:rotate(-45deg);font-size:.7rem;font-weight:900}
#wrap{position:relative}
#bd{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));width:100%;aspect-ratio:1;border:3px solid var(--ink);border-radius:10px;overflow:hidden;user-select:none;box-shadow:4px 4px 0 var(--ink);touch-action:none}
.sq{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.sq.l{background:var(--sl)}.sq.d{background:var(--sd)}
.sq.lm::before{content:"";position:absolute;inset:0;background:rgba(222,160,30,.42)}
.sq.sel::before{content:"";position:absolute;inset:0;background:rgba(222,160,30,.72)}
.sq.mv::after{content:"";width:26%;height:26%;border-radius:50%;background:rgba(31,30,28,.32);position:absolute;z-index:2}
.sq.mv.cp::after{width:90%;height:90%;background:none;border:4px solid rgba(31,30,28,.4)}
.sq i{position:absolute;font:900 .62rem/1 "Noto Sans KR",sans-serif;font-style:normal;z-index:1;color:#5a4426;opacity:.75}
.sq i.rk{top:3px;left:4px}.sq i.fl{bottom:3px;right:4px}
.pc{width:86%;height:86%;position:relative;z-index:1;pointer-events:none}
.sh{fill:var(--pf);stroke:var(--ps);stroke-width:4;stroke-linejoin:round}.dt{fill:none;stroke:var(--pd);stroke-width:3.5;stroke-linecap:round}
.pw{--pf:#fdfcf7;--ps:#1f1e1c;--pd:#1f1e1c}.pb{--pf:#24221f;--ps:#141311;--pd:#f1efe8}.pc.h{opacity:.45}.pc.fr{transform:rotate(180deg)}
#wrap .col2{position:absolute;width:25%;height:25%;z-index:3}#wrap .col2.sel3{filter:drop-shadow(0 0 6px #e0a21c)}
.ov{position:absolute;inset:0;border-radius:10px;background:rgba(31,30,28,.62);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px;z-index:6}
.ov .box{padding:16px 20px;display:grid;gap:12px;justify-items:center}.ov h2{font-size:1.35rem;word-break:keep-all}
.pk{display:flex;gap:8px}.pkb{padding:4px;width:62px;height:62px}.pkb .pc{width:100%;height:100%}
.stl{margin-top:12px;padding:8px 12px;font-weight:700;font-size:.92rem;text-align:center}
.side{display:grid;gap:16px}
.dk{padding:10px 12px 12px}.dk .bh{border:0;padding:0 0 8px}
.dkg{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.slot{border:2px dashed var(--mut);border-radius:10px;min-height:120px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-weight:900;font-size:.85rem}
.rot{transform:rotate(180deg)}.fdk{margin-bottom:14px}.rsg{padding:3px 10px;font-size:.78rem;box-shadow:2px 2px 0 var(--ink)}.fdk-w{margin:14px 0 0}
.peek.rot{top:16px;bottom:auto;transform:translateX(-50%) rotate(180deg)}
.log{padding:10px 12px}.log ol{margin:6px 0 0;padding-left:1.3em;font-size:.86rem;color:var(--mut);display:grid;gap:2px}
/* cards */
.cd{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:11px;box-shadow:3px 3px 0 var(--ink);padding:0 0 8px;overflow:hidden;font-weight:500;width:100%}
.cd::before{content:"";height:7px;background:var(--rc);border-bottom:2px solid var(--ink);display:block}
.r0{--rc:var(--r0)}.r1{--rc:var(--r1)}.r2{--rc:var(--r2)}.r3{--rc:var(--r3)}
.cd .ct{font-weight:900;text-align:center;padding:0 8px;font-size:1rem;word-break:keep-all}
.cd .ci{position:relative;margin:0 10px;height:74px;border:2px solid var(--ink);border-radius:7px;display:flex;align-items:center;justify-content:center;
 background:conic-gradient(var(--sd) 25%,var(--sl) 0 50%,var(--sd) 0 75%,var(--sl) 0) 0 0/24px 24px}
.cd .ci svg{width:52px;height:52px}
.cd .cdd{padding:0 10px;font-size:.8rem;color:var(--mut);flex:1;word-break:keep-all}
.cd .cf{display:flex;justify-content:space-between;padding:0 10px;font-size:.7rem;font-weight:900;letter-spacing:.03em}.cd .cf span{color:var(--rc)}
.stamp{position:absolute;left:50%;bottom:5px;transform:translateX(-50%) rotate(-7deg);background:var(--paper);border:2px solid var(--ink);border-radius:6px;padding:0 8px;font-weight:900;font-size:.72rem;letter-spacing:.06em;white-space:nowrap}
.stamp.u{background:#e7e4dc;color:#6b6860}.stamp.w{background:var(--acs)}
.cd.mini .ct{font-size:.86rem}.cd.mini .ci{height:50px;margin:0 8px}.cd.mini .ci svg{width:36px;height:36px}
.cd.mini .cdd{font-size:.72rem;padding:0 8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cd.mini .cf{padding:0 8px;font-size:.62rem}
.cd.used{opacity:.55}
button.cd{cursor:pointer}button.cd:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.cd.rdy{outline:3px solid var(--ac);outline-offset:1px}
.cuse{display:block;margin:2px 8px 0;text-align:center;font-weight:900;font-size:.75rem;background:var(--ac);color:#1f1e1c;border:2px solid var(--ink);border-radius:7px;padding:2px 0}
/* draft */
.dov{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(3px);overflow:auto;padding:16px}
.dov .in{max-width:1100px;margin:0 auto;display:grid;gap:12px}
.dh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 8px 6px 14px;font-weight:900;font-size:.92rem;max-width:560px;width:100%;margin:0 auto}.dh button{padding:4px 10px;font-size:.82rem}
.dcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;max-width:900px;width:100%;margin:0 auto}
.dcards .cd{gap:4px;padding-bottom:6px;box-shadow:2px 2px 0 var(--ink)}
.dcards .cd::before{height:6px}
.dcards .cd .ct{font-size:.9rem;padding:0 6px}
.dcards .cd .ci{height:46px;margin:0 8px}.dcards .cd .ci svg{width:34px;height:34px}
.dcards .cd .cdd{font-size:.74rem;line-height:1.4;padding:0 8px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.dcards .cd .cf{font-size:.6rem;padding:0 8px}
.dcards .stamp{font-size:.55rem;left:auto;right:3px;top:3px;bottom:auto;transform:none;padding:0 5px;border-width:1.5px}
.dnote{text-align:center;color:var(--mut);font-size:.85rem}
.peek{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;display:flex;gap:12px;align-items:center;padding:8px 10px 8px 16px;font-weight:900}
.waitc{padding:24px;text-align:center;max-width:420px;margin:0 auto}
/* modal & panels */
.mod{position:fixed;inset:0;z-index:60;background:rgba(31,30,28,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.mod .box{width:min(860px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.mhd{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:2px solid var(--ink)}
.mbd{display:grid;grid-template-columns:150px 1fr;min-height:0;flex:1}
.mnav{display:grid;gap:8px;align-content:start;padding:12px;border-right:2px solid var(--ink)}
.mnav button{text-align:left;padding:6px 10px}
.mct{padding:16px 18px;overflow:auto}.mct h2{font-size:1.25rem;margin-bottom:10px}.mct ul{padding-left:1.2em;margin:0;display:grid;gap:6px}
.mct .dkg{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.pnl{max-width:520px;padding:20px;display:grid;gap:12px;margin:20px auto}
.pnl h1{font-size:1.6rem}
.pnl input{font:inherit;padding:8px 12px;border-radius:10px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);width:9em}
.code{font:900 2.6rem/1 "Noto Sans KR",sans-serif;letter-spacing:.15em;color:var(--ac)}
@media (max-width:980px){.gm{grid-template-columns:minmax(0,1fr)}.mid{order:1}.side{order:2}.kibo{order:3;max-height:260px}}
@media (max-width:560px){.tb button,.bdg{padding:4px 9px;font-size:.8rem}.mbd{grid-template-columns:1fr}.mnav{grid-auto-flow:column;grid-auto-columns:max-content;overflow:auto;border-right:0;border-bottom:2px solid var(--ink)}
 .dcards{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.dcards .cd .ct{font-size:.78rem}.dcards .cd .ci{height:36px;margin:0 6px}.dcards .cd .ci svg{width:26px;height:26px}.dcards .cd .cdd{font-size:.66rem;padding:0 6px;-webkit-line-clamp:4}.dcards .cd .cf{font-size:.52rem;padding:0 6px}.dov{padding:10px}.vs{grid-template-columns:1fr auto 1fr;gap:6px}.tagp{padding:5px 7px}.tagp .cnt{display:none}}
.rx{--rc:var(--ink)}
.sb{position:absolute;right:1px;bottom:0;font-size:.62rem;z-index:3;pointer-events:none;line-height:1}
.mk{position:absolute;left:2px;top:1px;font-size:.7rem;z-index:3;pointer-events:none}
.sq.void{background:#1b1a18!important}
.sq.void .pc{display:none}
.sq.wall{box-shadow:inset 0 0 0 4px #7a4b23}
.sq.pal{box-shadow:inset 0 0 0 2px rgba(201,48,44,.5)}
.sq.bh{background-image:radial-gradient(circle,rgba(0,0,0,.35),transparent 70%)}
.sq.tv::after{content:"";position:absolute;inset:6%;border:3px dashed rgba(201,48,44,.75);border-radius:6px;z-index:2}
.sq.ts::before{content:"";position:absolute;inset:0;background:rgba(201,48,44,.45)}
.tgb{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;margin-bottom:10px;font-weight:700;background:var(--acs)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.pe{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--ink);border-radius:10px;padding:8px;background:var(--paper)}
.pe .pc{width:46px;height:46px;flex:none}
.pe p{font-size:.78rem;color:var(--mut);margin-top:2px;word-break:keep-all}
.pv{font-size:.72rem;font-weight:900;color:var(--r1)}
.cd.todo{opacity:.55}
.stl{word-break:keep-all}
.pn{--pf:#b9c48a;--ps:#2f3a1c;--pd:#2f3a1c}
.sq.hg{box-shadow:inset 0 0 0 3px rgba(222,160,30,.6)}
.sq.warn{animation:wr 1s infinite alternate}
@keyframes wr{to{background:#e8a09a}}
.tr-opt{text-align:left;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:200px}
.tr-opt p{margin:0;font-size:.85rem}
.tr-opt:hover{background:var(--acs)}
.rb{stroke:#fff;stroke-width:3;paint-order:stroke}
.rb.mj{fill:#c9302c}.rb.mn{fill:#2a6fd6}.rb.pw2{fill:#2e8b57}.rb.ry{fill:#b8860b}.rb.ot{fill:#7a4fc4}
.rbt{fill:#fff;font:900 21px 'Noto Sans KR',sans-serif;letter-spacing:-.5px}
.pb{filter:drop-shadow(0 0 1.2px rgba(255,255,255,.55))}
.pc.pb use{opacity:1}

.adn{color:var(--mut);font-size:.85rem;margin:4px 0 10px}
.adq{width:100%;padding:8px 10px;border:2px solid var(--ink);border-radius:8px;background:var(--paper);color:var(--ink);margin:8px 0}
.adl{display:grid;gap:10px}
.adr{border:2px solid var(--ink);border-radius:10px;padding:10px;background:var(--paper);display:grid;gap:6px}
.adr input,.adr textarea,.adr select,.bld input,.bld select,.bld textarea{border:2px solid var(--ink);border-radius:6px;padding:4px 6px;background:var(--paper);color:var(--ink);font:inherit;font-size:.85rem}
.adh{display:flex;gap:8px;align-items:center;justify-content:space-between}.adh .pc{width:36px;height:36px}
.adset{display:grid;gap:4px;font-size:.85rem;font-weight:700}
.bld{display:grid;grid-template-columns:150px 1fr 230px;gap:12px;align-items:start}
@media(max-width:900px){.bld{grid-template-columns:1fr}}
.bpal{display:grid;gap:6px;position:sticky;top:0}.bpal b{font-size:.78rem;margin-top:6px;color:var(--mut)}
.pbk,.blk{border-radius:8px;padding:6px 10px;color:#fff;font-weight:700;font-size:.82rem;display:flex;gap:6px;align-items:center;flex-wrap:wrap;border:2px solid rgba(0,0,0,.35);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.pbk{cursor:grab}.bm{background:#4f8cff}.be{background:#f0a020}.ba{background:#8a55d6}.bp{background:#3aa66a}.bh{background:#e0605a}.bhat{background:#555;border-radius:8px 8px 0 0}.bhat.be{background:#f0a020}
.bws{display:grid;gap:10px;min-height:300px}.bstack{display:grid;gap:4px;padding:6px;border:2px dashed rgba(128,128,128,.5);border-radius:10px}
.bstack.foc{border-color:#f0a020}.bempty{color:var(--mut);font-size:.8rem;padding:6px}
.blk select,.blk input[type=number],.blk input:not([type]){color:#111;background:#fff}
.bctl{margin-left:auto;display:flex;gap:2px}.bctl button{padding:0 6px;min-width:0;font-size:.7rem;box-shadow:none}
.bchk{display:flex;gap:4px;align-items:center;font-weight:700}
.bside{display:grid;gap:8px}.bprev{display:grid;grid-template-columns:repeat(8,1fr);border:2px solid var(--ink);width:100%;max-width:230px}
.bprev .sq{aspect-ratio:1;position:relative;display:flex;align-items:center;justify-content:center}.bprev .sq svg{width:90%;height:90%;position:relative;z-index:1}

#txfab{position:fixed;right:12px;bottom:12px;z-index:70;display:flex;gap:8px;align-items:center;background:var(--card,#fff);border:2px solid var(--ink,#1f1e1c);border-radius:12px;padding:6px 8px;font-size:.82rem;box-shadow:0 3px 0 rgba(0,0,0,.25)}
body.txe #app *:hover,body.txe #mod *:hover{outline:2px dashed #e0526b;outline-offset:1px;cursor:text}
body.txe #txfab *:hover,body.txe [data-notx] *:hover{outline:none;cursor:auto}
.abtn{display:inline-block;text-decoration:none;font-weight:700;color:var(--ink);background:var(--ac,#f3b63f);border:2px solid var(--ink);border-radius:10px;padding:7px 14px;box-shadow:2px 2px 0 var(--ink)}
.abtn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.rkme{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}.rkpts{font-size:1.8rem}.rkrec{color:var(--mut);font-size:.85rem}
.rklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}.rklist li{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:6px 8px;border:2px solid var(--ink);border-radius:10px;background:var(--paper)}

async function stUp(k,f){if(!f)return;STMSG='';
 if(f.size>2*1024*1024){STMSG='파일이 너무 커요. 2MB 이하로 골라 주세요.';return settings()}
 let ab,buf;try{ab=await f.arrayBuffer();buf=await sDec(ab.slice(0))}catch(e){STMSG='이 파일은 재생할 수 없어요. mp3, wav, ogg 파일을 써 주세요.';return settings()}
 if(buf.duration>10){STMSG='소리가 너무 길어요. 10초 이하로 골라 주세요.';return settings()}
 SBUF[k]=buf;let saved=true;try{await sput(k,{data:ab,name:f.name})}catch(e){saved=false}
 sv('acs-cn-'+k,f.name.slice(0,40));sv('acs-'+k,'1');STMSG=saved?'':'이 브라우저에서는 저장이 안 돼서, 창을 닫으면 기본 소리로 돌아가요.';sfx(k,1);settings()}
async function stRst(k){delete SBUF[k];sv('acs-cn-'+k,'');try{await sput(k,null)}catch(e){}STMSG='';settings()}
const stRoot=()=>location.href.split('?')[0].split('#')[0].replace(/(v\/)?[^\/]*$/,'');
async function stOld(){const el=document.getElementById('stold');if(!el)return;
 try{const r=await fetch(stRoot()+'v/index.json?_='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const L=await r.json();
  const cur=typeof VER!='undefined'?String(VER).replace(/-test$/,''):'';
  el.innerHTML=(L||[]).map(x=>`<div class="strow"><div class="stinfo"><b>v${stEsc(x.v)}${x.v==cur?' <em class="stchip">지금 보는 버전</em>':''}${x.r?' <em class="stchip">복원본</em>':''}</b><span>${stEsc(x.d||'')}${x.n?' · '+stEsc(x.n):''}</span></div>${x.x?`<div class="stctl"><em class="stchip">파일 없음</em></div>`:`<div class="stctl"><a class="abtn alt stsm" href="${stRoot()}v/${encodeURIComponent(x.v)}.html" target="_blank" rel="noopener">열기</a><a class="abtn alt stsm" href="${stRoot()}v/${encodeURIComponent(x.v)}.html" download="증강체스-v${stEsc(x.v)}.html">다운로드</a></div>`}</div>`).join('')||'<span class="stnote">아직 없어요.</span>'}
 catch(e){el.innerHTML='<span class="stnote">이전 버전 목록을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.</span>'}}
function settings(){const isBeta=!!window.__TEST,site=!!window.__SITE,vol=Math.round(sVol()*100);
 const beta=!site?'':`<section class="stsec"><h3>베타 버전</h3>${isBeta?'<p class="stnote">지금 <b>베타(테스트) 버전</b>을 쓰고 있어요.</p>':'<p class="stnote">새 기능을 미리 써 볼 수 있어요. 정식 버전과 같은 서버를 쓰니 점수는 그대로 이어져요.</p><div class="stbtns"><a class="abtn" href="test.html" download="증강체스-베타.html">베타 버전 다운로드</a><a class="abtn alt" href="test.html" target="_blank" rel="noopener">베타 버전 열기</a></div>'}</section>`;
 MOD.innerHTML=`<div class="mod" onclick="if(event.target===this)closeMod()"><div class="box stbox" role="dialog" aria-label="설정" data-notx><div class="sthd"><h2>설정</h2><button class="stic" aria-label="닫기" onclick="closeMod()">✕</button></div><div class="stbody">
 <section class="stsec"><h3>카드 표시</h3><p class="stnote">카드를 어떻게 보여 줄지 골라요.</p><div class="stcs"><button class="${CST=='fx'?'on':''}" onclick="setCs('fx')"><b>효과 표시</b><span>카드로 인해 적용될 효과를 글로 크게 보여 줘요</span></button><button class="${CST=='pic'?'on':''}" onclick="setCs('pic')"><b>그림 표시</b><span>효과가 적용된 판 모양을 그림으로 보여 줘요</span></button></div></section>
 <section class="stsec"><h3>소리</h3>
 <div class="strow"><div class="stinfo"><b>전체 소리</b><span>모든 효과음을 한 번에 켜고 꺼요</span></div><div class="stctl"><button class="sw ${SND?'on':''}" role="switch" aria-checked="${SND}" aria-label="전체 소리" onclick="snd();settings()"></button></div></div>
 <div class="strow"><div class="stinfo"><b>볼륨</b><span id="stvo">${vol}%</span></div><div class="stctl stvol"><input type="range" min="0" max="150" step="5" value="${vol}" oninput="stVol(this.value)" onchange="sfx('mv',1)" aria-label="볼륨"></div></div>
 </section>
 <section class="stsec"><h3>효과음</h3><p class="stnote">내 파일(mp3·wav·ogg, 2MB·10초 이하)을 넣으면 기본 소리 대신 재생돼요. 파일은 이 브라우저에만 저장돼요.</p>${SLOTS.map(x=>stRow(x[0],x[1],x[2])).join('')}${STMSG?`<p class="stmsg" role="status">${stEsc(STMSG)}</p>`:''}</section>
 ${beta}${site?'<section class="stsec"><h3>이전 버전</h3><p class="stnote">예전 버전을 열어 볼 수 있어요. <b>복원본</b>은 남아 있던 백업으로 다시 맞춘 거라 원래 버전과 조금 다를 수 있어요. 정식 버전과 같은 서버를 쓰고, 그때 없던 기능은 없어요.</p><div id="stold" class="stolds"><span class="stnote">불러오는 중…</span></div></section>':''}</div></div></div>`;if(site)stOld()}
function closeMod(){MOD.innerHTML=''}
function wiki(t,f){if(t)WT=t;if(f)WF=f;const tabs=[['rule','기본 규칙'],['card','카드'],['rar','희귀도'],['list','카드 목록'],['piece','기물'],['mode','다른 모드'],['log','업데이트 로그']];
 const flt=['ALL','OPENING','PIECE','MIDDLE','END','RULE'];
 const C={rule:`<h2>기본 규칙</h2><ul><li>체크메이트가 없으며, 상대 킹을 잡으면 승리합니다. 킹이 공격받는 칸으로도 갈 수 있습니다.</li><li>스테일메이트도 없으며, 움직일 수 있는 기물이 하나도 없으면 패배합니다.</li><li>50수 동안 잡기나 폰 이동이 없으면 무승부, 같은 배치가 3번 나오면 무승부입니다.</li><li>카드로 새로 생긴 기물은 그 턴에 기물을 잡을 수 없지만 움직일 수는 있습니다.</li><li>캐슬링, 앙파상, 폰 승급(선택) 등 나머지는 일반 체스 규칙을 따릅니다.</li></ul>`,
 card:`<h2>카드</h2><ul><li>드래프트는 ${DM=='orig'?'게임 시작 직후, 10수 후, 20수 후에 열리며 3장 중 1장을 고릅니다.':'게임 시작 직후와 5수마다(40수까지) 열리며 무작위 10장 중 1장을 고릅니다.'}</li><li><b>패시브</b> 카드는 고르는 즉시 자동으로 적용되고, <b>액티브</b> 카드는 원하는 자기 차례에 사용합니다. 대상을 고르는 카드는 보드에서 칸을 눌러 지정합니다.</li><li>OPENING 카드는 첫 드래프트에만, END 카드는 첫 드래프트 이후에만 나옵니다. PIECE와 MIDDLE은 모든 드래프트에 나옵니다.</li><li>첫 드래프트 이후에 얻은 MIDDLE·END 카드는 다음 자기 차례부터 쓸 수 있습니다.</li><li>RULE 카드는 드래프트에 나오지 않고, 게임 시작 시 20% 확률로 등장해 양측 모두에게 적용됩니다.</li><li>원본 카드 ${CARDS.length}장 중 ${IMPLN}장이 구현되어 있고, 나머지는 '준비 중'으로 드래프트에 나오지 않습니다.</li></ul>`,
 rar:`<h2>희귀도</h2><ul><li>모든 카드(RULE 제외)는 COMMON / RARE / EPIC / LEGEND 중 하나의 희귀도를 가집니다.</li><li>등급이 높을수록 드래프트에 등장할 확률이 낮습니다.</li><li>원본 드래프트에서는 마지막 드래프트에 COMMON 카드가 나오지 않습니다.</li></ul><div class="row" style="margin-top:12px">${RN.map((n,i)=>`<span class="bdg" style="color:var(--r${i})">${n}</span>`).join('')}</div>`,
 list:`<h2>카드 목록 (${CARDS.length}장 · 구현 ${IMPLN}장)</h2><div class="seg" style="margin-bottom:12px">${flt.map(x=>`<button class="${WF==x?'on':''}" onclick="wiki('list','${x}')">${x=='ALL'?'전체':x} ${x=='ALL'?CARDS.length:CARDS.filter(y=>y.t==x).length}</button>`).join('')}</div><div class="dkg">${CARDS.filter(x=>WF=='ALL'||x.t==WF).map(x=>cardHtml(x,{cls:'mini',state:x.im?'':'todo'})).join('')}</div>`,
 piece:`<h2>기물 (${Object.keys(PT).length}종)</h2><div class="plist">${Object.entries(PT).sort((a,b)=>a[1][1]-b[1][1]).map(([t,P])=>`<div class="pe">${pieceSvg('w',t)}<div><b>${P[0]}</b> <span class="pv">${isRoyal(t)?'왕족':P[1]+'점'}</span><p>${P[4]}</p></div></div>`).join('')}</div>`,
 log:`<h2>업데이트 로그</h2><h3 style=\"margin:14px 0 6px\">v0.164 <span style=\"font-weight:500;color:var(--mut);font-size:.8rem\">2026-10-25</span></h3><ul><li>관리자 패널에 \"AI·모드\" 탭이 생겼어요. AI 기본 레이팅, 그랜드 모드 켜기·카드 수, 랭크전 열기·닫기, 모든 AI에게 줄 강화를 정할 수 있어요.</li><li>\"유저·랭크\" 탭에서 유저 점수를 바꾸고 랭크전 참여를 막을 수 있어요.</li><li>\"공지·이벤트\" 탭에서 메뉴에 공지를 띄우고, 기간을 정해 랭크 점수 2배 이벤트나 레전더리 카드 등장 확률 이벤트를 열 수 있어요.</li></ul><h3 style=\"margin:14px 0 6px\">v0.163 <span style=\"font-weight:500;color:var(--mut);font-size:.8rem\">2026-10-24</span></h3><ul><li>카드 모양을 나무위키처럼 바꿨어요. 위에 등급과 이름, 가운데 그림, 아래에 설명과 종류가 나와요. 설명 속 기물 이름은 주황색으로 보여요.</li><li>카드 그림이 효과를 적용한 판 모양을 보여 줘요. 바뀐 칸은 노란 테두리, 효과를 받은 기물은 파란 테두리, ⛔·➜·⏳ 같은 표시로 개념도 알려 줘요. 기물 카드에는 움직일 수 있는 칸을 점으로 보여 줘요.</li><li>설정에 \"카드 표시\"가 생겼어요. \"그림\"(기본)은 판 그림으로 직관적으로, \"효과\"는 카드로 인해 적용되는 효과 설명 위주로 보여 줘요.</li></ul><h3 style=\"margin:14px 0 6px\">v0.162 <span style=\"font-weight:500;color:var(--mut);font-size:.8rem\">2026-10-24</span></h3><ul><li>그랜드 모드: 드래프트 없이 시작할 때 카드 24장 중 흑부터 번갈아 6장씩 골라요. END 카드는 3수 뒤부터 쓸 수 있고, 시작 RULE 확률은 절반이에요.</li><li>AI 강화: 메뉴의 “AI 강화”에서 오버클럭·여제·전장의 안개·더 나은 선택·추가 병사·암살 전문가·성전·매너·대규모 카드 지원·나, 주사위 선언을 AI에게 줄 수 있어요.</li><li>가속 규칙 설명을 실제 동작에 맞게 고쳤어요.</li></ul><h3 style=\"margin:14px 0 6px\">v0.161 <span style=\"font-weight:500;color:var(--mut);font-size:.8rem\">2026-10-24</span></h3><ul><li>업데이트 확인과 진행 막대 화면을 없앴어요. 새 버전은 페이지를 새로고침하면 열려요.</li></ul><h3 style=\"margin:14px 0 6px\">v0.160 <span style=\"font-weight:500;color:var(--mut);font-size:.8rem\">2026-10-24</span></h3><ul><li>AI 레이팅: 메뉴에서 AI 실력을 400~2400으로 고를 수 있어요. 낮을수록 실수가 잦고 수를 덜 읽어요. “자동 조절”을 켜면 이길 때 +100, 질 때 −100씩 바뀌어요.</li><li>경기 분석: AI·2인 대국이 끝나면 “경기 분석”으로 수마다 평가(천재적인 수·최선의 수·실수·큰 실수 등), 정확도, 형세 그래프를 볼 수 있어요.</li></ul><h3 style=\"margin:14px 0 6px\">v0.159 <span style=\"font-weight:500;color:var(--mut);font-size:.8rem\">2026-10-24</span></h3><ul><li>테스트 버전의 업데이트 화면이 1~10분 사이 무작위 시간으로 진행되고 남은 시간이 보여요. 정식 버전에는 보이는 변화가 없어요.</li></ul><h3 style=\"margin:14px 0 6px\">v0.158 <span style=\"font-weight:500;color:var(--mut);font-size:.8rem\">2026-10-24</span></h3><ul><li>사이트판: 업데이트 확인과 진행 막대 화면은 테스트 버전(test.html)에서만 동작해요. 정식 버전에서는 자동 업데이트를 뺐어요.</li></ul><h3 style=\"margin:14px 0 6px\">v0.157 <span style=\"font-weight:500;color:var(--mut);font-size:.8rem\">2026-10-24</span></h3><ul><li>사이트판: 설정에서 이전 버전(v0.150~)을 열거나 내려받을 수 있어요.</li></ul><h3 style=\"margin:14px 0 6px\">v0.156 <span style=\"font-weight:500;color:var(--mut);font-size:.8rem\">2026-10-24</span></h3><ul><li>설정 화면 추가: 기물 움직임·기물 잡기·클릭·승리·패배·카드 소리를 각각 켜고 끄고, 볼륨을 조절해요. 패배 소리와 클릭 소리가 새로 생겼어요.</li><li>내 소리 넣기: 효과음마다 내 mp3·wav·ogg 파일로 바꿀 수 있어요(이 브라우저에만 저장).</li><li>사이트판: 설정에서 베타(테스트) 버전을 내려받거나 열 수 있어요.</li></ul><h3 style=\"margin:14px 0 6px\">v0.155 <span style=\"font-weight:500;color:var(--mut);font-size:.8rem\">2026-10-24</span></h3><ul><li>사이트판: 자동 업데이트. 새 버전이 올라오면 메뉴 화면에서 알아서 새로고침하고, 게임 중에는 '지금 업데이트' 알림만 띄워요.</li></ul><h3 style=\"margin:14px 0 6px\">v0.154 <span style=\"font-weight:500;color:var(--mut);font-size:.8rem\">2026-10-24</span></h3><ul><li>사이트판: 게스트 모드 추가. 로그인 없이 '게스트1234' 같은 임시 닉네임으로 바로 입장해요(점수는 이 브라우저에만 저장).</li></ul><h3 style=\"margin:14px 0 6px\">v0.153 <span style=\"font-weight:500;color:var(--mut);font-size:.8rem\">2026-10-24</span></h3><ul><li>사이트판: 자동 로그인 강화. 한 번 로그인하면 며칠이 지나도, 탭을 여러 개 열어도 로그인이 유지돼요(만료 전에 미리 갱신).</li></ul><h3 style=\"margin:14px 0 6px\">v0.152 <span style=\"font-weight:500;color:var(--mut);font-size:.8rem\">2026-10-24</span></h3><ul><li>사이트판: 관리자 계정 지원. 관리자는 카드·글자 편집 등 설정을 서버에 저장하고 모든 유저에게 적용해요.</li></ul><h3 style=\"margin:14px 0 6px\">v0.151 <span style=\"font-weight:500;color:var(--mut);font-size:.8rem\">2026-10-24</span></h3><ul><li>사이트판: 이메일+비밀번호 로그인 추가 (서버에 저장, 어느 기기에서나 이어짐)</li></ul><h3 style=\"margin:14px 0 6px\">v0.150 <span style=\"font-weight:500;color:var(--mut);font-size:.8rem\">2026-10-24</span></h3><ul><li>사이트판: 디스코드로 로그인 지원 (Supabase 연결 시) — 점수가 서버에 저장되고 공용 순위표 이용, 닉네임 중복 서버에서 차단</li></ul><h3 style=\"margin:14px 0 6px\">v0.149 <span style=\"font-we  else{const big=loss>3.5;k=big?'blu':'mis';if(prev&&prev.loss>=2&&loss>=1.6)k='mss'}

function rvRun(){const T=REC.slice();RVD=T.length<=50?3:2;const R={res:[],n:T.length,run:1,gen:(RV&&RV.gen||0)+1};RV=R;const gen=R.gen;let i=0;
 const step=()=>{if(RV!==R)return;const t0=Date.now();while(i<T.length&&Date.now()-t0<30){const prev=R.res.length?R.res[R.res.length-1]:null;let pv=null;for(let j=R.res.length-1;j>=0;j--)if(R.res[j].c!=T[i].c){pv=R.res[j];break}R.res.push(rvOne(T[i],pv));i++}
  if(i>=T.length){R.run=0;rvDone(R)}else{const p=document.getElementById('rvp');if(p)p.textContent=Math.round(100*i/T.length)+'%';setTimeout(step,0)}};
 setTimeout(step,20)}
function rvDone(R){const side=c=>{const L=R.res.filter(x=>x.c==c),n=L.length,cnt={};for(const x of L)cnt[x.k]=(cnt[x.k]||0)+1;const acc=n?L.reduce((a,x)=>a+100*Math.exp(-.4*x.loss),0)/n:0;return{n,cnt,acc}};R.w=side('w');R.b=side('b');if(S.scr&&document.getElementById('rvbody'))rvDraw()}
function rvGraph(R){const W=300,H=84,n=R.res.length;if(n<2)return '';const pts=R.res.map((x,i)=>[(i+1)/n*W,H/2-x.ev/12*(H/2-4)]);const pt=[[0,H/2]].concat(pts);const line=pt.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
 return `<svg class="rvg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="형세 그래프"><rect width="${W}" height="${H/2}" fill="#fff" opacity=".9"/><rect y="${H/2}" width="${W}" height="${H/2}" fill="#2b2a28" opacity=".9"/><polygon points="0,${H/2} ${line} ${W},${H/2}" fill="rgba(217,154,43,.55)"/><polyline points="${line}" fill="none" stroke="#d99a2b" stroke-width="1.6"/><line x1="0" y1="${H/2}" x2="${W}" y2="${H/2}" stroke="#888" stroke-width=".6"/></svg>`}
function rvDraw(){const R=RV,el=document.getElementById('rvbody');if(!R||!el)return;
 const nm=c=>(S.ai?(c==S.aiC?'AI':'나'):name(c));
 const used=RVO.filter(k=>(R.w.cnt[k]||0)+(R.b.cnt[k]||0)>0);
 const sum=`<div class="rvsum"><div class="rvc2"><b>${name('w')}${S.ai?' · '+nm('w'):''}</b><div class="rvacc">${Math.round(R.w.acc)}<small>%</small></div><span>정확도</span></div><div class="rvc2"><b>${name('b')}${S.ai?' · '+nm('b'):''}</b><div class="rvacc">${Math.round(R.b.acc)}<small>%</small></div><span>정확도</span></div></div>
 <div class="rvtab">${used.map(k=>`<div class="rvrow"><span class="rvn">${R.w.cnt[k]||0}</span><span class="rvl">${rvIcon(k,18)} ${RVK[k][0]}</span><span class="rvn">${R.b.cnt[k]||0}</span></div>`).join('')}</div>`;
 let rows='',no=0;R.res.forEach((x,i)=>{const w=x.c=='w';if(w)no++;const tail=x.bm?` <span class="rvbm">추천 ${stEsc(x.bm)}</span>`:'';const lo=x.loss>=.8?` <span class="rvls">−${x.loss.toFixed(1)}</span>`:'';
  rows+=`<div class="rvmv ${w?'w':'b'}"><span class="rvn">${w?no+'.':''}</span><span class="rvmc">${w?'백':'흑'}</span><b>${stEsc(x.s)}</b>${rvIcon(x.k,20)}<span class="rvkn">${RVK[x.k][0]}</span>${lo}${tail}</div>`});
 el.innerHTML=sum+rvGraph(R)+'<p class="stnote rvnt">그래프는 위쪽이 백, 아래쪽이 흑이 유리해요.</p><div class="rvlist">'+rows+'</div>'}
function review(){if(!REC.length){MOD.innerHTML=`<div class="mod" onclick="if(event.target===this)closeMod()"><div class="box stbox" role="dialog" aria-label="경기 분석" data-notx><div class="sthd"><h2>경기 분석</h2><button class="stic" aria-label="닫기" onclick="closeMod()">✕</button></div><div class="stbody"><p class="stnote">분석할 수가 아직 없어요. 온라인 대국은 분석을 지원하지 않아요.</p></div></div></div>`;return}
 MOD.innerHTML=`<div class="mod" onclick="if(event.target===this)closeMod()"><div class="box stbox" role="dialog" aria-label="경기 분석" data-notx><div class="sthd"><h2>경기 분석</h2><button class="stic" aria-label="닫기" onclick="closeMod()">✕</button></div><div class="stbody"><p class="stnote">기물 가치를 기준으로 몇 수 앞을 계산한 간단한 분석이에요. 카드 효과는 따로 계산하지 않아요.</p><div id="rvbody"><p class="rvwait">분석하는 중… <b id="rvp">0%</b></p></div></div></div></div>`;
 if(RV&&!RV.run&&RV.n==REC.length)rvDraw();else rvRun()}
